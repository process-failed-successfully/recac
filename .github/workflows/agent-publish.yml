name: Publish Agent Image

on:
  push:
    branches: ["*"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Safe Branch Name
        id: branch_name
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          # Replace unsafe characters with hyphens
          SAFE_NAME=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          # Truncate to 60 chars to stay well within limits
          SAFE_NAME="${SAFE_NAME:0:60}"
          # Remove trailing hyphen
          SAFE_NAME="${SAFE_NAME%-}"
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.branch_name.outputs.safe_name }},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: internal/docker/agent.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
