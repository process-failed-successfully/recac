<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recac Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .section { margin-bottom: 30px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; text-transform: capitalize; }
        .status-done { background: #d4edda; color: #155724; }
        .status-inprogress { background: #cce5ff; color: #004085; }
        .status-pending { background: #e2e3e5; color: #383d41; }
        .status-failed { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        tbody tr { transition: background-color 0.15s ease-in-out; }
        tbody tr:hover { background-color: #f1f3f5; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; overflow-wrap: break-word; }
        th { background-color: #f8f9fa; }
        .col-id { width: 15%; }
        .col-desc { width: 55%; }
        .col-status { width: 15%; }
        .col-priority { width: 15%; }
        #graph { width: 100%; height: 500px; border: 1px solid #ddd; background: white; overflow: hidden; }
        .empty-message { text-align: center; padding: 2em; color: #666; }
        .error-message { text-align: center; padding: 2em; color: #721c24; background-color: #f8d7da; }
        .copy-btn { background: none; border: none; padding: 0; color: #007bff; font-weight: bold; font-family: inherit; font-size: inherit; cursor: pointer; text-decoration: underline; transition: color 0.15s ease-in-out; }
        .copy-btn:hover { color: #0056b3; }
        .copy-btn:focus-visible { outline: 2px solid #0056b3; outline-offset: 2px; border-radius: 2px; }
        .copy-btn.copy-success { color: #155724; text-decoration: none; }
        .copy-btn.copy-failed { color: #721c24; text-decoration: none; }
        .action-btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.15s ease-in-out, opacity 0.15s ease-in-out; }
        .action-btn:hover:not(:disabled):not([aria-disabled="true"]) { background: #0056b3; }
        .action-btn:focus-visible { outline: 2px solid #0056b3; outline-offset: 2px; }
        .action-btn:disabled, .action-btn[aria-disabled="true"] { background: #6c757d; cursor: not-allowed; opacity: 0.65; }
        .empty-message .action-btn, .error-message .action-btn { margin-top: 16px; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .last-updated { font-size: 13px; color: #666; font-style: italic; }
        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            vertical-align: middle;
            margin-right: 0.5em;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
                border-right-color: currentColor;
                opacity: 0.7;
            }
            tbody tr, .copy-btn, .action-btn {
                transition: none !important;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Recac Project Dashboard</h1>
            <div class="header-actions">
                <span id="last-updated" class="last-updated" aria-live="polite"></span>
                <button id="refresh-btn" type="button" class="action-btn" onclick="loadData()" aria-label="Refresh Dashboard" title="Refresh Dashboard (Shortcut: 'r')">Refresh</button>
            </div>
        </header>

        <section class="section" aria-labelledby="graph-heading">
            <h2 id="graph-heading">Task Dependency Graph</h2>
            <div id="graph" class="mermaid">
                <div class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading graph...</div>
            </div>
        </section>

        <section class="section" aria-labelledby="table-heading">
            <h2 id="table-heading">Features & Tasks</h2>
            <div class="table-responsive">
                <table id="features-table" aria-labelledby="table-heading">
                    <thead>
                        <tr>
                            <th scope="col" class="col-id">ID</th>
                            <th scope="col" class="col-desc">Description</th>
                            <th scope="col" class="col-status">Status</th>
                            <th scope="col" class="col-priority">Priority</th>
                        </tr>
                    </thead>
                    <tbody aria-live="polite">
                        <tr><td colspan="4" class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading features...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        mermaid.initialize({ startOnLoad: false });

        async function loadData() {
            const refreshBtn = document.getElementById('refresh-btn');

            // Prevent concurrent API requests
            if (refreshBtn && refreshBtn.getAttribute('aria-disabled') === 'true') return;

            // Rescue focus if it's inside an area about to be destroyed
            const active = document.activeElement;
            if (active && (document.getElementById('graph').contains(active) || document.getElementById('features-table').contains(active))) {
                if (refreshBtn) refreshBtn.focus();
            }

            if (refreshBtn) {
                refreshBtn.setAttribute('aria-disabled', 'true');
                refreshBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Refreshing...';
                refreshBtn.setAttribute('aria-busy', 'true');
                refreshBtn.setAttribute('aria-label', 'Refreshing Dashboard');
                refreshBtn.title = 'Refreshing Dashboard';
            }
            try {
                document.getElementById('graph').removeAttribute('data-processed');
                document.getElementById('graph').innerHTML = '<div class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading graph...</div>';
                document.querySelector('#features-table tbody').innerHTML = '<tr><td colspan="4" class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading features...</td></tr>';

                // Fetch Features
                const featuresResp = await fetch('/api/features');
                const features = await featuresResp.json();
                renderFeatures(features);

                // Fetch Graph
                const graphResp = await fetch('/api/graph');
                const graphData = await graphResp.text();
                renderGraph(graphData);

                const now = new Date();
                document.getElementById('last-updated').textContent = 'Last updated: ' + now.toLocaleTimeString();
            } catch (e) {
                console.error("Error loading data:", e);
                document.getElementById('graph').innerHTML = '<div class="error-message">Error loading data. Is the server running?<br><button type="button" class="action-btn" onclick="loadData()">Retry</button></div>';
                const tbody = document.querySelector('#features-table tbody');
                tbody.innerHTML = '<tr><td colspan="4" class="error-message">Error loading features. <br><button type="button" class="action-btn" onclick="loadData()">Retry</button></td></tr>';
            } finally {
                if (refreshBtn) {
                    refreshBtn.removeAttribute('aria-disabled');
                    refreshBtn.textContent = 'Refresh';
                    refreshBtn.removeAttribute('aria-busy');
                    refreshBtn.setAttribute('aria-label', 'Refresh Dashboard');
                    refreshBtn.title = 'Refresh Dashboard (Shortcut: \'r\')';
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn && !refreshBtn.hasAttribute('aria-disabled')) {
                    refreshBtn.click();
                }
            }
        });

        function renderFeatures(features) {
            const tbody = document.querySelector('#features-table tbody');
            tbody.innerHTML = '';
            if (!features || features.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-message">No features or tasks found.<br><br><button type="button" class="action-btn" onclick="loadData()">Refresh</button></td></tr>';
                return;
            }
            features.forEach(f => {
                const tr = document.createElement('tr');
                let statusClass = 'status-pending';
                if (f.status === 'done') statusClass = 'status-done';
                else if (f.status === 'in_progress') statusClass = 'status-inprogress';
                else if (f.status === 'failed') statusClass = 'status-failed';

                const tdId = document.createElement('td');
                const idBtn = document.createElement('button');
                idBtn.type = 'button';
                idBtn.setAttribute('aria-label', 'Copy ID ' + f.id);
                idBtn.title = 'Click to copy ID';
                idBtn.className = 'copy-btn';
                idBtn.textContent = f.id;
                idBtn.onclick = async function() {
                    if (this.innerText === 'Copied!' || this.innerText === 'Failed!') return;
                    const originalText = this.innerText;
                    try {
                        await navigator.clipboard.writeText(f.id);
                        this.innerText = 'Copied!';
                        this.classList.add('copy-success');
                        this.setAttribute('aria-label', 'Copied ID ' + f.id);
                        this.title = 'Copied ID';
                    } catch (err) {
                        console.error('Failed to copy ID: ', err);
                        this.innerText = 'Failed!';
                        this.classList.add('copy-failed');
                        this.setAttribute('aria-label', 'Failed to copy ID ' + f.id);
                        this.title = 'Failed to copy ID';
                    }
                    setTimeout(() => {
                        this.innerText = originalText;
                        this.classList.remove('copy-success', 'copy-failed');
                        this.setAttribute('aria-label', 'Copy ID ' + f.id);
                        this.title = 'Click to copy ID';
                    }, 1500);
                };
                tdId.appendChild(idBtn);
                tr.appendChild(tdId);

                const tdDesc = document.createElement('td');
                tdDesc.textContent = f.description;
                tr.appendChild(tdDesc);

                const tdStatus = document.createElement('td');
                const spanStatus = document.createElement('span');
                spanStatus.className = `status-badge ${statusClass}`;
                spanStatus.textContent = f.status.replace(/_/g, ' ');
                tdStatus.appendChild(spanStatus);
                tr.appendChild(tdStatus);

                const tdPriority = document.createElement('td');
                const spanPriority = document.createElement('span');
                spanPriority.className = 'status-badge status-pending';
                spanPriority.textContent = (f.priority || 'unassigned').replace(/_/g, ' ');
                tdPriority.appendChild(spanPriority);
                tr.appendChild(tdPriority);

                tbody.appendChild(tr);
            });
        }

        async function renderGraph(graphDef) {
            const element = document.getElementById('graph');
            if (!graphDef || graphDef.trim() === '') {
                 element.innerHTML = '<div class="empty-message">No graph data available.<br><br><button type="button" class="action-btn" onclick="loadData()">Refresh</button></div>';
                 return;
            }
            // Check if graphDef is valid mermaid syntax
            if (!graphDef.trim().startsWith('graph')) {
                 element.innerHTML = '';
                 const pre = document.createElement('pre');
                 pre.textContent = graphDef;
                 element.appendChild(pre);
                 return;
            }
            element.textContent = graphDef;
            await mermaid.run({ nodes: [element] });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
