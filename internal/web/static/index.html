<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recac Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .section { margin-bottom: 30px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .status-done { background: #d4edda; color: #155724; }
        .status-inprogress { background: #cce5ff; color: #004085; }
        .status-pending { background: #e2e3e5; color: #383d41; }
        .status-failed { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .graph-wrapper { width: 100%; height: 500px; border: 1px solid #ddd; background: white; position: relative; }
        #graph { width: 100%; height: 100%; overflow: hidden; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .refresh-btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .refresh-btn:hover { background: #0056b3; }
        .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }
        .spinner { width: 20px; height: 20px; border: 2px solid #f3f3f3; border-top: 2px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
        .error-message { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 20px; display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1>Recac Project Dashboard</h1>
            <button id="refresh-btn" class="refresh-btn" aria-label="Refresh data">
                <span class="btn-text">Refresh</span>
            </button>
        </div>

        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <div class="section">
            <h2>Task Dependency Graph</h2>
            <div class="graph-wrapper">
                <div id="graph" class="mermaid"></div>
                <div class="loading-overlay" aria-label="Loading graph...">
                     <div class="spinner"></div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Features & Tasks</h2>
            <table id="features-table">
                <caption>List of project features and their current status</caption>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="loading-row">
                        <td colspan="4" style="text-align: center; padding: 20px;">
                            <div class="spinner" style="margin: 0 auto;"></div>
                            <span class="sr-only">Loading features...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false });

        function setLoading(isLoading) {
            const btn = document.getElementById('refresh-btn');
            const graphOverlay = document.querySelector('.graph-wrapper .loading-overlay');
            const tableBody = document.querySelector('#features-table tbody');
            const errorDiv = document.getElementById('error-message');

            if (btn) btn.disabled = isLoading;
            if (isLoading) {
                if (errorDiv) errorDiv.style.display = 'none';
                if (graphOverlay) graphOverlay.style.display = 'flex';
                if (tableBody) {
                    tableBody.innerHTML = `
                        <tr class="loading-row">
                            <td colspan="4" style="text-align: center; padding: 20px;">
                                <div class="spinner" style="margin: 0 auto;"></div>
                                <span class="sr-only">Loading features...</span>
                            </td>
                        </tr>`;
                }
            } else {
                if (graphOverlay) graphOverlay.style.display = 'none';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';

            // Also update graph to show error if it's empty
            const graphEl = document.getElementById('graph');
            if (!graphEl.querySelector('svg')) {
                 graphEl.innerHTML = `<div style="padding: 20px; color: red;">${msg}</div>`;
            }
        }

        async function loadData() {
            setLoading(true);
            try {
                // Fetch Features
                const featuresResp = await fetch('/api/features');
                if (!featuresResp.ok) throw new Error(`HTTP error! status: ${featuresResp.status}`);
                const features = await featuresResp.json();
                renderFeatures(features);

                // Fetch Graph
                const graphResp = await fetch('/api/graph');
                if (!graphResp.ok) throw new Error(`HTTP error! status: ${graphResp.status}`);
                const graphData = await graphResp.text();
                await renderGraph(graphData);

            } catch (e) {
                console.error("Error loading data:", e);
                showError("Error loading data. Is the server running?");
                const tbody = document.querySelector('#features-table tbody');
                if (tbody) tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #721c24;">Error loading data</td></tr>';
            } finally {
                setLoading(false);
            }
        }

        function renderFeatures(features) {
            const tbody = document.querySelector('#features-table tbody');
            tbody.innerHTML = '';

            if (!features || features.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">No features found.</td></tr>';
                return;
            }

            features.forEach(f => {
                const tr = document.createElement('tr');
                let statusClass = 'status-pending';
                if (f.status === 'done') statusClass = 'status-done';
                else if (f.status === 'in_progress') statusClass = 'status-inprogress';
                else if (f.status === 'failed') statusClass = 'status-failed';

                const tdId = document.createElement('td');
                tdId.textContent = f.id;
                tr.appendChild(tdId);

                const tdDesc = document.createElement('td');
                tdDesc.textContent = f.description;
                tr.appendChild(tdDesc);

                const tdStatus = document.createElement('td');
                const spanStatus = document.createElement('span');
                spanStatus.className = `status-badge ${statusClass}`;
                spanStatus.textContent = f.status;
                tdStatus.appendChild(spanStatus);
                tr.appendChild(tdStatus);

                const tdPriority = document.createElement('td');
                tdPriority.textContent = f.priority;
                tr.appendChild(tdPriority);

                tbody.appendChild(tr);
            });
        }

        async function renderGraph(graphDef) {
            const element = document.getElementById('graph');
            // Check if graphDef is valid mermaid syntax
            if (!graphDef.trim().startsWith('graph')) {
                 element.innerHTML = '';
                 const pre = document.createElement('pre');
                 pre.textContent = graphDef;
                 element.appendChild(pre);
                 return;
            }

            element.textContent = graphDef;
            element.removeAttribute('data-processed'); // Ensure mermaid re-processes it
            await mermaid.run({ nodes: [element] });
        }

        document.getElementById('refresh-btn').addEventListener('click', loadData);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
