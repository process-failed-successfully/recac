<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recac Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <style>
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #0056b3;
            color: white;
            padding: 8px;
            z-index: 100;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus-visible {
            top: 0;
            outline: 2px solid white;
            outline-offset: -2px;
        }
        #main-content:focus { outline: none; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .section { margin-bottom: 30px; }
        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; text-transform: capitalize; }
        .status-done { background: #d4edda; color: #155724; }
        .status-inprogress { background: #cce5ff; color: #004085; }
        .status-pending { background: #e2e3e5; color: #383d41; }
        .status-failed { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        tbody tr { transition: background-color 0.15s ease-in-out; }
        tbody tr:not(.message-row):hover, tbody tr:not(.message-row):focus-within { background-color: #f1f3f5; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; overflow-wrap: break-word; }
        thead th { background-color: #f8f9fa; }
        .col-id { width: 15%; }
        .col-desc { width: 55%; }
        .col-status { width: 15%; }
        .col-priority { width: 15%; }
        #graph { width: 100%; height: 500px; border: 1px solid #ddd; background: white; overflow: auto; }
        #graph:focus-visible { outline: 2px solid #004085; outline-offset: -2px; }
        .empty-message { text-align: center; padding: 3em 2em; color: #666; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        .state-icon { font-size: 2.5em; margin-bottom: 8px; opacity: 0.6; }
        .state-hint { font-size: 0.9em; color: #555; max-width: 400px; margin: 0 auto; line-height: 1.4; }
        .error-message { text-align: center; padding: 2em; color: #721c24; background-color: #f8d7da; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        .error-message .state-hint { color: inherit; opacity: 0.9; }
        .copy-btn { background: none; border: none; padding: 0; color: #0056b3; font-weight: bold; font-family: inherit; font-size: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: color 0.15s ease-in-out, transform 0.15s ease-in-out; }
        .copy-btn:active { transform: scale(0.97); }
        .copy-btn:hover, .copy-btn:focus-visible { text-decoration: underline; color: #004085; }
        .copy-btn:focus-visible { outline: 2px solid #004085; outline-offset: 2px; border-radius: 2px; text-decoration: underline; }
        .copy-btn.copy-success { color: #155724; text-decoration: none; }
        .copy-btn.copy-failed { color: #721c24; text-decoration: none; }
        .category-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background: #e9ecef; color: #495057; margin-right: 8px; vertical-align: middle; }
        .action-btn { background: #0056b3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.15s ease-in-out, opacity 0.15s ease-in-out, transform 0.15s ease-in-out; }
        .action-btn:hover:not(:disabled):not([aria-disabled="true"]) { background: #004085; }
        .action-btn:focus-visible { outline: 2px solid #004085; outline-offset: 2px; }
        .action-btn:disabled, .action-btn[aria-disabled="true"] { background: #6c757d; cursor: not-allowed; opacity: 0.65; }
        .action-btn:active:not(:disabled):not([aria-disabled="true"]) { transform: scale(0.97); }
        .empty-message .action-btn, .error-message .action-btn { margin-top: 16px; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .table-message-cell { padding: 0 !important; }
        .table-message-block { margin: 0; border-radius: 0; }
        .table-responsive:focus-visible { outline: 2px solid #004085; outline-offset: -2px; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .last-updated { font-size: 13px; color: #666; font-style: italic; }
        .is-updating {
            opacity: 0.6;
            pointer-events: none;
            transition: opacity 0.15s ease-in-out;
        }
        .shortcut-hint {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 6px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            font-family: monospace;
            border: 1px solid rgba(255, 255, 255, 0.3);
            vertical-align: middle;
        }
        @media (max-width: 768px) {
            .shortcut-hint { display: none; }
        }
        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            vertical-align: middle;
            margin-right: 0.5em;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
                border-right-color: currentColor;
                opacity: 0.7;
            }
            tbody tr, .copy-btn, .action-btn, .is-updating {
                transition: none !important;
            }
            .action-btn:active:not(:disabled):not([aria-disabled="true"]), .copy-btn:active {
                transform: none;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="container" tabindex="-1">
        <header class="header">
            <h1>Recac Project Dashboard</h1>
            <div class="header-actions">
                <span id="last-updated" class="last-updated" aria-live="polite"></span>
                <button id="refresh-btn" type="button" class="action-btn" onclick="loadData()" aria-label="Refresh Dashboard" title="Refresh Dashboard (Shortcut: 'r')" aria-keyshortcuts="r">Refresh<kbd aria-hidden="true" class="shortcut-hint">R</kbd></button>
            </div>
        </header>

        <noscript>
            <style>
                .section, .header-actions { display: none !important; }
            </style>
            <div class="error-message" role="alert" style="margin-bottom: 20px;">
                <span class="state-icon" aria-hidden="true">⚠️</span>
                <strong>JavaScript is required</strong>
                <span class="state-hint">Please enable JavaScript to view and interact with the Recac Dashboard.</span>
            </div>
        </noscript>

        <section class="section" aria-labelledby="graph-heading">
            <h2 id="graph-heading">Task Dependency Graph</h2>
            <div id="graph" class="mermaid" tabindex="0" role="region" aria-label="Task Dependency Graph">
                <div class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading graph...</div>
            </div>
        </section>

        <section class="section" aria-labelledby="table-heading">
            <h2 id="table-heading">Features & Tasks <span id="task-count" class="category-badge" title="Total Tasks: 0"><span class="sr-only">Total Tasks: </span>0</span></h2>
            <div class="table-responsive" tabindex="0" role="region" aria-label="Features and Tasks Data">
                <table id="features-table" aria-labelledby="table-heading">
                    <thead>
                        <tr>
                            <th scope="col" class="col-id">ID</th>
                            <th scope="col" class="col-desc">Description</th>
                            <th scope="col" class="col-status">Status</th>
                            <th scope="col" class="col-priority">Priority</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="message-row"><td colspan="4" class="table-message-cell"><div class="empty-message table-message-block"><span class="spinner" aria-hidden="true"></span>Loading features...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        mermaid.initialize({ startOnLoad: false });

        async function loadData() {
            const refreshBtn = document.getElementById('refresh-btn');

            // Prevent concurrent API requests
            if (refreshBtn && refreshBtn.getAttribute('aria-disabled') === 'true') return;

            // Rescue focus if it's inside an area about to be destroyed
            const active = document.activeElement;
            if (active && (document.getElementById('graph').contains(active) || document.getElementById('features-table').contains(active))) {
                if (refreshBtn) refreshBtn.focus();
            }

            if (refreshBtn) {
                refreshBtn.setAttribute('aria-disabled', 'true');
                refreshBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Refreshing...';
                refreshBtn.setAttribute('aria-busy', 'true');
                refreshBtn.setAttribute('aria-label', 'Refreshing Dashboard');
                refreshBtn.title = 'Refreshing Dashboard';
            }
            try {
                const graphEl = document.getElementById('graph');
                const tbody = document.querySelector('#features-table tbody');

                // If it's already empty or has an error, show the spinner immediately
                if (graphEl.querySelector('.empty-message') || graphEl.querySelector('.error-message') || graphEl.children.length === 0) {
                    graphEl.innerHTML = '<div class="empty-message"><span class="spinner" aria-hidden="true"></span>Loading graph...</div>';
                } else {
                    graphEl.classList.add('is-updating');
                }

                if (tbody.querySelector('.empty-message') || tbody.querySelector('.error-message') || tbody.children.length === 0) {
                    tbody.innerHTML = '<tr class="message-row"><td colspan="4" class="table-message-cell"><div class="empty-message table-message-block"><span class="spinner" aria-hidden="true"></span>Loading features...</div></td></tr>';
                } else {
                    tbody.classList.add('is-updating');
                }

                graphEl.removeAttribute('data-processed');
                graphEl.setAttribute('aria-busy', 'true');
                const tbodyToUpdate = document.querySelector('#features-table tbody');
                if (tbodyToUpdate) tbodyToUpdate.setAttribute('aria-busy', 'true');

                // Fetch Features
                const featuresResp = await fetch('/api/features');
                const features = await featuresResp.json();
                renderFeatures(features);

                // Fetch Graph
                const graphResp = await fetch('/api/graph');
                const graphData = await graphResp.text();
                renderGraph(graphData);

                const now = new Date();
                const lastUpdatedEl = document.getElementById('last-updated');
                lastUpdatedEl.textContent = 'Last updated: ' + now.toLocaleTimeString();
                lastUpdatedEl.title = now.toLocaleString();
            } catch (e) {
                console.error("Error loading data:", e);
                document.title = '⚠️ Error - Recac Dashboard';
                document.getElementById('graph').innerHTML = `<div class="error-message" role="alert">
                    <span class="state-icon" aria-hidden="true">⚠️</span>
                    <strong>Error loading data</strong>
                    <span class="state-hint">Is the server running?</span>
                    <button type="button" class="action-btn" onclick="loadData()" aria-label="Retry loading graph"><span aria-hidden="true">🔄</span> Retry</button>
                </div>`;
                const tbody = document.querySelector('#features-table tbody');
                tbody.innerHTML = `<tr class="message-row"><td colspan="4" class="table-message-cell">
                    <div class="error-message table-message-block" role="alert">
                        <span class="state-icon" aria-hidden="true">⚠️</span>
                        <strong>Error loading features</strong>
                        <span class="state-hint">Failed to fetch task data.</span>
                        <button type="button" class="action-btn" onclick="loadData()" aria-label="Retry loading features"><span aria-hidden="true">🔄</span> Retry</button>
                    </div>
                </td></tr>`;
            } finally {
                const graphEl = document.getElementById('graph');
                const tbody = document.querySelector('#features-table tbody');
                graphEl.classList.remove('is-updating');
                graphEl.removeAttribute('aria-busy');
                tbody.classList.remove('is-updating');
                tbody.removeAttribute('aria-busy');

                if (refreshBtn) {
                    refreshBtn.removeAttribute('aria-disabled');
                    refreshBtn.innerHTML = 'Refresh<kbd aria-hidden="true" class="shortcut-hint">R</kbd>';
                    refreshBtn.removeAttribute('aria-busy');
                    refreshBtn.setAttribute('aria-label', 'Refresh Dashboard');
                    refreshBtn.title = 'Refresh Dashboard (Shortcut: \'r\')';
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn && !refreshBtn.hasAttribute('aria-disabled')) {
                    refreshBtn.click();
                }
            }
        });

        function renderFeatures(features) {
            const tbody = document.querySelector('#features-table tbody');
            tbody.innerHTML = '';

            const taskCountEl = document.getElementById('task-count');
            if (taskCountEl) {
                const count = features ? features.length : 0;
                taskCountEl.innerHTML = '<span class="sr-only">Total Tasks: </span>' + count;
                taskCountEl.title = 'Total Tasks: ' + count;

                if (count > 0) {
                    document.title = `(${count}) Recac Dashboard`;
                } else {
                    document.title = 'Recac Dashboard';
                }
            }

            if (!features || features.length === 0) {
                tbody.innerHTML = `<tr class="message-row"><td colspan="4" class="table-message-cell">
                    <div class="empty-message table-message-block">
                        <span class="state-icon" aria-hidden="true">📋</span>
                        <strong>No features or tasks found</strong>
                        <span class="state-hint">Create a Jira ticket with the appropriate label to see tasks here.</span>
                        <button type="button" class="action-btn" onclick="loadData()"><span aria-hidden="true">🔄</span> Refresh Dashboard</button>
                    </div>
                </td></tr>`;
                return;
            }
            features.forEach(f => {
                const tr = document.createElement('tr');
                let statusClass = 'status-pending';
                if (f.status === 'done') statusClass = 'status-done';
                else if (f.status === 'in_progress') statusClass = 'status-inprogress';
                else if (f.status === 'failed') statusClass = 'status-failed';

                const tdId = document.createElement('th');
                tdId.scope = 'row';
                const idBtn = document.createElement('button');
                idBtn.type = 'button';
                idBtn.setAttribute('aria-label', 'Copy ID ' + f.id);
                idBtn.title = 'Click to copy ID';
                idBtn.className = 'copy-btn';

                const iconSpan = document.createElement('span');
                iconSpan.setAttribute('aria-hidden', 'true');
                iconSpan.textContent = '📋';
                idBtn.appendChild(iconSpan);
                idBtn.appendChild(document.createTextNode(' ' + f.id));

                idBtn.onclick = async function() {
                    if (this.classList.contains('copy-success') || this.classList.contains('copy-failed')) return;

                    try {
                        await navigator.clipboard.writeText(f.id);
                        iconSpan.textContent = '✅';
                        this.lastChild.textContent = ' Copied!';
                        this.classList.add('copy-success');
                        this.setAttribute('aria-label', 'Copied ID ' + f.id);
                        this.title = 'Copied ID';
                        const announcer = document.getElementById('a11y-announcer');
                        if (announcer) announcer.textContent = 'Copied ID ' + f.id;
                    } catch (err) {
                        console.error('Failed to copy ID: ', err);
                        iconSpan.textContent = '❌';
                        this.lastChild.textContent = ' Failed!';
                        this.classList.add('copy-failed');
                        this.setAttribute('aria-label', 'Failed to copy ID ' + f.id);
                        this.title = 'Failed to copy ID';
                        const announcer = document.getElementById('a11y-announcer');
                        if (announcer) announcer.textContent = 'Failed to copy ID ' + f.id;
                    }
                    setTimeout(() => {
                        iconSpan.textContent = '📋';
                        this.lastChild.textContent = ' ' + f.id;
                        this.classList.remove('copy-success', 'copy-failed');
                        this.setAttribute('aria-label', 'Copy ID ' + f.id);
                        this.title = 'Click to copy ID';
                        const announcer = document.getElementById('a11y-announcer');
                        if (announcer) announcer.textContent = '';
                    }, 1500);
                };
                tdId.appendChild(idBtn);
                tr.appendChild(tdId);

                const tdDesc = document.createElement('td');

                if (f.category && f.category.trim() !== '') {
                    const spanCategory = document.createElement('span');
                    spanCategory.className = 'category-badge';
                    spanCategory.title = 'Category: ' + f.category;
                    const srSpan = document.createElement('span');
                    srSpan.className = 'sr-only';
                    srSpan.textContent = 'Category: ';
                    spanCategory.appendChild(srSpan);
                    spanCategory.appendChild(document.createTextNode(f.category));
                    tdDesc.appendChild(spanCategory);
                }

                if (!f.description || f.description.trim() === '') {
                    const spanDesc = document.createElement('span');
                    spanDesc.className = 'state-hint';
                    spanDesc.textContent = 'No description provided';
                    tdDesc.appendChild(spanDesc);
                } else {
                    tdDesc.appendChild(document.createTextNode(f.description));
                }
                tr.appendChild(tdDesc);

                const tdStatus = document.createElement('td');
                const spanStatus = document.createElement('span');
                spanStatus.className = `status-badge ${statusClass}`;

                const statusIconSpan = document.createElement('span');
                statusIconSpan.setAttribute('aria-hidden', 'true');
                if (f.status === 'done') statusIconSpan.textContent = '✅';
                else if (f.status === 'in_progress') statusIconSpan.textContent = '🔄';
                else if (f.status === 'failed') statusIconSpan.textContent = '❌';
                else statusIconSpan.textContent = '🕒';

                spanStatus.appendChild(statusIconSpan);
                spanStatus.appendChild(document.createTextNode(f.status.replace(/_/g, ' ')));
                tdStatus.appendChild(spanStatus);
                tr.appendChild(tdStatus);

                const tdPriority = document.createElement('td');
                const spanPriority = document.createElement('span');
                spanPriority.className = 'status-badge status-pending';
                spanPriority.textContent = f.priority ? String(f.priority).replace(/_/g, ' ') : 'unassigned';
                tdPriority.appendChild(spanPriority);
                tr.appendChild(tdPriority);

                tbody.appendChild(tr);
            });
        }

        async function renderGraph(graphDef) {
            const element = document.getElementById('graph');
            if (!graphDef || graphDef.trim() === '') {
                 element.innerHTML = `<div class="empty-message">
                    <span class="state-icon" aria-hidden="true">📊</span>
                    <strong>No dependency graph available</strong>
                    <span class="state-hint">Once features are created, their relationships will be visualized here.</span>
                    <button type="button" class="action-btn" onclick="loadData()"><span aria-hidden="true">🔄</span> Refresh Dashboard</button>
                 </div>`;
                 return;
            }
            // Check if graphDef is valid mermaid syntax
            if (!graphDef.trim().startsWith('graph')) {
                 element.innerHTML = '';
                 const pre = document.createElement('pre');
                 pre.textContent = graphDef;
                 element.appendChild(pre);
                 return;
            }
            element.textContent = graphDef;
            await mermaid.run({ nodes: [element] });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
